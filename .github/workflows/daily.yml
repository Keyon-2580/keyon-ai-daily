name: Daily AI Frontier

on:
  schedule:
    - cron: "0 1 * * *"   # 每日 09:00 北京时间 (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Fetch RSS and rebuild data
        run: python3 scripts/fetch_rss.py
      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore(data): daily refresh $(date -u +%F)"
          git push
